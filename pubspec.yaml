name: igloo_dio_logger
description: A beautiful HTTP request/response logger for Dio with ANSI colors, emojis, and advanced filtering options.
version: 1.1.2
homepage: https://github.com/igloodev/igloo_dio_logger
repository: https://github.com/igloodev/igloo_dio_logger
issue_tracker: https://github.com/igloodev/igloo_dio_logger/issues

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  dio: ^5.9.2
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

topics:
  - dio
  - logging
  - http
  - networking
  - debugging
